[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neon-serverless"
version = "0.1.0"
description = "Serverless Postgres driver for Neon — SQL over HTTP, sync and async"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Tamer Coskun", email = "tugrultamerc@gmail.com" }]
keywords = ["neon", "postgres", "postgresql", "serverless", "database", "http", "driver"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
]
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "build", "twine"]

[project.urls]
Homepage = "https://github.com/tamercoskun/neon-serverless-py"
Documentation = "https://github.com/tamercoskun/neon-serverless-py#readme"
Issues = "https://github.com/tamercoskun/neon-serverless-py/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/neon_serverless"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
